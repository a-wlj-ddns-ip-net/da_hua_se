<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联网大话骰</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #1b2838; color: #fff; padding: 20px; text-align: center; }
    #app { max-width: 600px; margin: 0 auto; background: #2a475e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h1 { margin-bottom: 15px; color: #66c0f4; }
    
    .panel { background: #171a21; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, select, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
    button { background: #66c0f4; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #4192c4; }
    button:disabled { background: #555; cursor: not-allowed; }

    /* 骰子样式：Unicode 符号，1和4标红 */
    .dice-container { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .dice { 
      width: 70px; 
      height: 70px; 
      background-color: white; 
      border: 1px solid black; 
      border-radius: 10px; 
      font-size: 65px; 
      text-align: center; 
      line-height: 70px; 
      color: black;
      user-select: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .dice.red { color: red; }

    /* 玩家列表 */
    .player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .player-card { background: #2a475e; padding: 10px; border-radius: 5px; border: 2px solid transparent; width: 140px; }
    .player-card.active { border-color: #f39c12; background: #3d5a80; }
    .player-card.ready { color: #2ecc71; }

    #logBox { height: 140px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border-radius: 5px; font-size: 14px; color: #00ff00; line-height: 1.5; }
    #connectionStatus { font-size: 14px; margin-bottom: 10px; color: #f39c12; }
  </style>
</head>
<body>

<div id="app">
  <h1>🎲 联网大话骰</h1>
  <div id="connectionStatus">正在连接服务器...</div>

  <!-- 加入房间面板 -->
  <div id="joinPanel" class="panel">
    <input type="text" id="nicknameInput" placeholder="输入昵称" maxlength="10">
    <button id="joinBtn" onclick="joinGame()" disabled>加入游戏</button>
  </div>

  <!-- 游戏主区域 -->
  <div id="gamePanel" style="display:none;">
    
    <!-- 玩家状态 -->
    <div class="panel">
      <h3>房间玩家</h3>
      <div id="playerList" class="player-list"></div>
      <button id="readyBtn" onclick="toggleReady()" style="margin-top: 15px;">准备</button>
    </div>

    <!-- 当前叫注 -->
    <div class="panel">
      <h3>当前叫注</h3>
      <h2 id="currentBidText" style="color: #f1c40f; margin: 10px 0;">暂无</h2>
    </div>

    <!-- 我的骰子 -->
    <div class="panel">
      <h3>我的骰子</h3>
      <div id="myDice" class="dice-container"></div>
    </div>

    <!-- 操作区 -->
    <div id="actionPanel" class="panel" style="display:none;">
      <h3>轮到你操作</h3>
      <div>
        <input type="number" id="bidCount" min="1" max="30" value="2" style="width: 70px;"> 个 
        <select id="bidValue">
          <option value="1">1 点</option>
          <option value="2">2 点</option>
          <option value="3">3 点</option>
          <option value="4">4 点</option>
          <option value="5" selected>5 点</option>
          <option value="6">6 点</option>
        </select>
        <button onclick="placeBid()">叫注</button>
      </div>
      <div style="margin-top: 10px;">
        <button onclick="challenge()" style="background: #e74c3c;">质疑（开！）</button>
      </div>
    </div>

    <!-- 游戏日志 -->
    <div class="panel">
      <div id="logBox"></div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myId = null;
  let myDice = [];

  const diceMap = { 1: '⚀', 2: '⚁', 3: '⚂', 4: '⚃', 5: '⚄', 6: '⚅' };

  socket.on('connect', () => {
    myId = socket.id;
    document.getElementById('connectionStatus').textContent = '✅ 已成功连接服务器';
    document.getElementById('connectionStatus').style.color = '#2ecc71';
    document.getElementById('joinBtn').disabled = false;
  });

  socket.on('disconnect', () => {
    document.getElementById('connectionStatus').textContent = '❌ 与服务器断开连接，请刷新页面';
    document.getElementById('connectionStatus').style.color = '#e74c3c';
    document.getElementById('joinBtn').disabled = true;
  });

  function joinGame() {
    const name = document.getElementById('nicknameInput').value.trim();
    socket.emit('joinGame', name);
    document.getElementById('joinPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
  }

  function toggleReady() {
    socket.emit('toggleReady');
  }

  function placeBid() {
    const count = parseInt(document.getElementById('bidCount').value);
    const value = parseInt(document.getElementById('bidValue').value);
    socket.emit('placeBid', { count, value });
  }

  function challenge() {
    socket.emit('challenge');
  }

  socket.on('yourDice', (dice) => {
    myDice = dice;
    renderMyDice();
  });

  socket.on('updateRoom', ({ players, gameState, currentBid, turnPlayerId }) => {
    const listEl = document.getElementById('playerList');
    listEl.innerHTML = '';
    players.forEach(p => {
      const card = document.createElement('div');
      card.className = `player-card ${p.id === turnPlayerId ? 'active' : ''} ${p.isReady ? 'ready' : ''}`;
      card.innerHTML = `
        <strong>${p.name} ${p.id === myId ? '(我)' : ''}</strong><br>
        ${gameState === 'LOBBY' ? (p.isReady ? '已准备' : '未准备') : '🎲 5颗骰子'}
      `;
      listEl.appendChild(card);
    });

    const bidText = currentBid ? `${currentBid.playerName} 叫了：<strong>${currentBid.count}</strong> 个 <strong>${currentBid.value} 点 (${diceMap[currentBid.value]})</strong>` : '无';
    document.getElementById('currentBidText').innerHTML = bidText;

    const isMyTurn = (turnPlayerId === myId) && (gameState === 'PLAYING');
    document.getElementById('actionPanel').style.display = isMyTurn ? 'block' : 'none';
    document.getElementById('readyBtn').style.display = gameState === 'LOBBY' ? 'inline-block' : 'none';
  });

  socket.on('roundResult', ({ message, allPlayersDice }) => {
    log(message);
    let revealStr = "\n【全场骰子揭晓】\n";
    allPlayersDice.forEach(p => {
      const formattedDice = p.dice.map(d => diceMap[d]).join(' ');
      revealStr += `${p.name}: ${formattedDice}\n`;
    });
    log(revealStr);
  });

  socket.on('logMessage', (msg) => log(msg));
  socket.on('errorMsg', (msg) => alert(msg));

  function renderMyDice() {
    const container = document.getElementById('myDice');
    container.innerHTML = '';
    myDice.forEach(val => {
      const el = document.createElement('div');
      el.className = 'dice';
      if (val === 1 || val === 4) {
        el.classList.add('red');
      }
      el.innerText = diceMap[val] || val;
      container.appendChild(el);
    });
  }

  function log(msg) {
    const box = document.getElementById('logBox');
    box.innerHTML += `<div>${msg.replace(/\n/g, '<br>')}</div>`;
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
